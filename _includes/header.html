{% assign current_lang = page.lang | default: "kr" %}
{% assign home_url = "/" | relative_url %}
{% if current_lang == "jp" %}
  {% assign home_url = "/jp/" | relative_url %}
{% endif %}

<div class='header'>
  <div class="container">
    <div class="logo">
      <a href="{{ home_url }}"><img width="{{ site.logo.desktop_width }}" height="{{ site.logo.desktop_height }}" alt="{{ site.title }}" src="{{ site.logo.desktop | relative_url }}" /></a>
    </div>
    <div class="logo-mobile">
      <a href="{{ home_url }}"><img width="{{ site.logo.mobile_width }}" height="{{ site.logo.mobile_height }}" alt="{{ site.title }}" src="{{ site.logo.mobile | relative_url }}" /></a>
    </div>
    
    {% include main-menu.html lang=current_lang %}
    {% include hamburger.html %}
  </div>
</div>
